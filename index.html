<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Anki Web Reader</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#f0f7ff', 100: '#e0effe', 500: '#0284c7', 600: '#0369a1', 700: '#075985' }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- JSZip -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <!-- sql.js (WebAssembly SQLite) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>

  <style>
    .perspective-1000 { perspective: 1000px; }
    .transform-style-3d { transform-style: preserve-3d; }
    .backface-hidden { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
    .rotate-y-180 { transform: rotateY(180deg); }
    
    /* Anki HTML styling support */
    .anki-content img { max-width: 100%; height: auto; margin: 0.5rem auto; display: block; border-radius: 0.375rem; }
    .anki-content ul { list-style-type: disc; padding-left: 1.25rem; }
    .anki-content ol { list-style-type: decimal; padding-left: 1.25rem; }
    .anki-content code { background-color: rgba(0,0,0,0.05); padding: 0.1rem 0.3rem; border-radius: 0.25rem; font-size: 0.9em; }
    .dark .anki-content code { background-color: rgba(255,255,255,0.1); }
    
    /* Cloze Deletion Styling */
    .cloze { font-weight: 600; color: #0284c7; padding: 0 0.15rem; }
    .dark .cloze { color: #38bdf8; }
  </style>
</head>
<body class="h-full bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 transition-colors duration-200 flex flex-col font-sans select-none antialiased">

  <!-- Top Navigation Header -->
  <header class="bg-white/80 dark:bg-slate-800/80 backdrop-blur border-b border-slate-200 dark:border-slate-700 px-4 py-3 flex items-center justify-between sticky top-0 z-20">
    <div class="flex items-center gap-2">
      <div class="p-1.5 bg-brand-500 text-white rounded-lg shadow-sm">
        <i data-lucide="layers" class="w-5 h-5"></i>
      </div>
      <h1 class="font-bold text-lg tracking-tight bg-gradient-to-r from-slate-900 to-slate-700 dark:from-white dark:to-slate-300 bg-clip-text text-transparent">Anki Reader</h1>
    </div>
    
    <div class="flex items-center gap-2">
      <button id="themeToggle" class="p-2 rounded-xl text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700 transition">
        <i data-lucide="moon" id="themeIcon" class="w-5 h-5"></i>
      </button>

      <!-- Fixed iOS WebKit Native Input Button -->
      <div class="relative overflow-hidden inline-flex items-center gap-1.5 bg-brand-600 hover:bg-brand-700 text-white font-medium text-xs sm:text-sm px-3.5 py-2 rounded-xl shadow-sm transition active:scale-95">
        <i data-lucide="upload" class="w-4 h-4"></i>
        <span>Import Deck</span>
        <input type="file" id="fileInputHeader" accept="*/*" class="absolute inset-0 opacity-0 w-full h-full cursor-pointer z-10" />
      </div>
    </div>
  </header>

  <!-- Main App View Container -->
  <main class="flex-1 flex flex-col p-4 max-w-xl w-full mx-auto justify-between overflow-hidden relative">

    <!-- Empty / Welcome State -->
    <div id="welcomeView" class="flex-1 flex flex-col items-center justify-center text-center px-4">
      <div class="w-20 h-20 bg-brand-50 dark:bg-slate-800 text-brand-500 rounded-3xl flex items-center justify-center mb-6 shadow-sm border border-slate-200 dark:border-slate-700">
        <i data-lucide="file-up" class="w-10 h-10"></i>
      </div>
      <h2 class="text-2xl font-bold mb-2">No Deck Loaded</h2>
      <p class="text-slate-500 dark:text-slate-400 text-sm max-w-sm mb-6">
        Select an <code class="text-xs bg-slate-200 dark:bg-slate-800 px-1.5 py-0.5 rounded font-mono">.apkg</code> file to import your flashcard deck.
      </p>

      <!-- Main Center iOS WebKit Native Input Button -->
      <div class="relative overflow-hidden inline-flex items-center gap-2 bg-brand-600 hover:bg-brand-700 text-white font-semibold text-sm px-6 py-3 rounded-2xl shadow-md hover:shadow-lg transition active:scale-95">
        <i data-lucide="folder-open" class="w-5 h-5"></i>
        <span>Choose .apkg File</span>
        <input type="file" id="fileInputCenter" accept="*/*" class="absolute inset-0 opacity-0 w-full h-full cursor-pointer z-10" />
      </div>
    </div>

    <!-- Processing & Loading Overlay -->
    <div id="loadingView" class="hidden flex-1 flex flex-col items-center justify-center text-center px-4">
      <div class="w-12 h-12 border-4 border-brand-500 border-t-transparent rounded-full animate-spin mb-4"></div>
      <p id="loadingStatus" class="text-sm font-medium text-slate-600 dark:text-slate-300">Reading .apkg package...</p>
    </div>

    <!-- Active Flashcard Study View -->
    <div id="studyView" class="hidden flex-1 flex flex-col justify-between gap-4">
      
      <!-- Top Meta Stats bar -->
      <div class="flex items-center justify-between text-xs font-semibold text-slate-400 dark:text-slate-500 px-1">
        <span id="cardProgress">Card 1 of 100</span>
        <button id="shuffleBtn" class="flex items-center gap-1 hover:text-brand-500 transition">
          <i data-lucide="shuffle" class="w-3.5 h-3.5"></i> Shuffle
        </button>
      </div>

      <!-- Card Container with 3D Flip Effect -->
      <div class="flex-1 perspective-1000 my-auto min-h-[320px] max-h-[500px]">
        <div id="cardInner" class="w-full h-full relative transform-style-3d transition-transform duration-500 cursor-pointer rounded-3xl shadow-lg border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-800">
          
          <!-- Front Face -->
          <div class="absolute inset-0 w-full h-full backface-hidden p-6 sm:p-8 flex flex-col justify-between overflow-y-auto">
            <div class="text-xs uppercase tracking-wider text-slate-400 font-bold mb-2">Question</div>
            <div id="cardFront" class="anki-content flex-1 flex flex-col justify-center text-center text-lg sm:text-xl leading-relaxed text-slate-800 dark:text-slate-100"></div>
            <div class="text-center text-xs text-slate-400 font-medium pt-4 flex items-center justify-center gap-1">
              <i data-lucide="rotate-cw" class="w-3.5 h-3.5"></i> Tap card to reveal answer
            </div>
          </div>

          <!-- Back Face -->
          <div class="absolute inset-0 w-full h-full backface-hidden rotate-y-180 p-6 sm:p-8 flex flex-col justify-between overflow-y-auto">
            <div class="text-xs uppercase tracking-wider font-bold text-brand-500 mb-2">Answer</div>
            <div id="cardBack" class="anki-content flex-1 flex flex-col justify-center text-center text-lg sm:text-xl leading-relaxed text-slate-800 dark:text-slate-100"></div>
            <div class="text-center text-xs text-slate-400 font-medium pt-4">
              Tap card to view question
            </div>
          </div>

        </div>
      </div>

      <!-- Action & Navigation Controls -->
      <div class="flex items-center justify-between gap-3 pt-2">
        <button id="prevBtn" class="flex-1 py-3 px-4 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-semibold text-sm shadow-sm hover:bg-slate-100 dark:hover:bg-slate-700 active:scale-95 transition flex items-center justify-center gap-1.5 disabled:opacity-40">
          <i data-lucide="chevron-left" class="w-4 h-4"></i> Previous
        </button>
        <button id="nextBtn" class="flex-1 py-3 px-4 rounded-2xl bg-brand-600 text-white font-semibold text-sm shadow-md hover:bg-brand-700 active:scale-95 transition flex items-center justify-center gap-1.5 disabled:opacity-40">
          Next <i data-lucide="chevron-right" class="w-4 h-4"></i>
        </button>
      </div>

    </div>

  </main>

  <script>
    let SQL = null;
    let cards = [];
    let currentIndex = 0;
    let isFlipped = false;
    let mediaFiles = {};

    const fileInputHeader = document.getElementById('fileInputHeader');
    const fileInputCenter = document.getElementById('fileInputCenter');
    const welcomeView = document.getElementById('welcomeView');
    const loadingView = document.getElementById('loadingView');
    const studyView = document.getElementById('studyView');
    const loadingStatus = document.getElementById('loadingStatus');

    const cardInner = document.getElementById('cardInner');
    const cardFront = document.getElementById('cardFront');
    const cardBack = document.getElementById('cardBack');
    const cardProgress = document.getElementById('cardProgress');

    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const shuffleBtn = document.getElementById('shuffleBtn');
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');

    lucide.createIcons();

    themeToggle.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      const isDark = document.documentElement.classList.contains('dark');
      themeIcon.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
      lucide.createIcons();
    });

    async function getSQLEngine() {
      if (!SQL) {
        SQL = await initSqlJs({
          locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${file}`
        });
      }
      return SQL;
    }

    async function decompressZstd(uint8Array) {
      if (!window.ZstdCodec) {
        await new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.src = 'https://cdn.jsdelivr.net/npm/zstd-codec@0.1.2/bundle/zstd-codec.min.js';
          script.onload = resolve;
          script.onerror = reject;
          document.head.appendChild(script);
        });
      }
      return new Promise((resolve) => {
        window.ZstdCodec.run(zstd => {
          const simple = new zstd.Simple();
          const decompressed = simple.decompress(uint8Array);
          resolve(decompressed);
        });
      });
    }

    async function handleFileUpload(file) {
      if (!file) return;

      showView('loading');
      updateStatus('Unpacking .apkg package...');

      try {
        const zip = await JSZip.loadAsync(file);
        
        mediaFiles = {};
        const mediaFileEntry = zip.file(/media$/i)[0];
        if (mediaFileEntry) {
          const mediaMapText = await mediaFileEntry.async('text');
          try {
            const mediaMap = JSON.parse(mediaMapText);
            for (const [key, filename] of Object.entries(mediaMap)) {
              const fileData = zip.file(key);
              if (fileData) {
                const blob = await fileData.async('blob');
                mediaFiles[filename] = URL.createObjectURL(blob);
              }
            }
          } catch (err) {
            console.warn('Failed to parse media mapping JSON:', err);
          }
        }

        updateStatus('Opening collection database...');
        let dbBuffer = null;

        const anki21bEntry = zip.file(/collection\.anki21b$/i)[0];
        const anki21Entry = zip.file(/collection\.anki21$/i)[0];
        const anki2Entry = zip.file(/collection\.anki2$/i)[0];

        if (anki21bEntry) {
          updateStatus('Decompressing modern Anki v3 database...');
          const compressedData = await anki21bEntry.async('uint8array');
          dbBuffer = await decompressZstd(compressedData);
        } else if (anki21Entry) {
          dbBuffer = await anki21Entry.async('uint8array');
        } else if (anki2Entry) {
          dbBuffer = await anki2Entry.async('uint8array');
        } else {
          const anyDb = zip.file(/.*\.(anki2|anki21|sqlite|db)$/i)[0];
          if (anyDb) {
            dbBuffer = await anyDb.async('uint8array');
          } else {
            throw new Error('Valid APKG collection database not found in file.');
          }
        }

        const sqlEngine = await getSQLEngine();
        const db = new sqlEngine.Database(dbBuffer);
        
        cards = [];
        const res = db.exec("SELECT flds FROM notes");
        if (res.length > 0 && res[0].values) {
          res[0].values.forEach(row => {
            const fields = row[0].split('\x1f');
            const frontRaw = fields[0] || '';
            const backRaw = fields.length > 1 ? fields.slice(1).join('<br>') : fields[0];

            if (!frontRaw.includes("Please update to the latest Anki version")) {
              cards.push({
                front: processCardText(frontRaw),
                back: processCardText(backRaw)
              });
            }
          });
        }

        if (cards.length === 0) {
          throw new Error('No valid flashcards found inside this deck.');
        }

        currentIndex = 0;
        showCard(currentIndex);
        showView('study');

      } catch (err) {
        alert(`Error loading deck: ${err.message}`);
        showView('welcome');
      }
    }

    fileInputHeader.addEventListener('change', (e) => handleFileUpload(e.target.files[0]));
    fileInputCenter.addEventListener('change', (e) => handleFileUpload(e.target.files[0]));

    function processCardText(rawHtml) {
      if (!rawHtml) return '';
      let processed = rawHtml.replace(/\{\{c\d+::(.*?)(?:::.*?)?\}\}/g, '<span class="cloze">[$1]</span>');

      const parser = new DOMParser();
      const doc = parser.parseFromString(processed, 'text/html');
      const imgs = doc.querySelectorAll('img');

      imgs.forEach(img => {
        const src = img.getAttribute('src');
        if (src && mediaFiles[src]) {
          img.setAttribute('src', mediaFiles[src]);
        }
      });

      return doc.body.innerHTML;
    }

    function showCard(index) {
      if (!cards[index]) return;

      isFlipped = false;
      cardInner.classList.remove('rotate-y-180');

      cardFront.innerHTML = cards[index].front;
      cardBack.innerHTML = cards[index].back;

      cardProgress.innerText = `Card ${index + 1} of ${cards.length}`;
      prevBtn.disabled = index === 0;
      nextBtn.disabled = index === cards.length - 1;
    }

    cardInner.addEventListener('click', () => {
      isFlipped = !isFlipped;
      cardInner.classList.toggle('rotate-y-180');
    });

    prevBtn.addEventListener('click', () => {
      if (currentIndex > 0) {
        currentIndex--;
        showCard(currentIndex);
      }
    });

    nextBtn.addEventListener('click', () => {
      if (currentIndex < cards.length - 1) {
        currentIndex++;
        showCard(currentIndex);
      }
    });

    shuffleBtn.addEventListener('click', () => {
      cards.sort(() => Math.random() - 0.5);
      currentIndex = 0;
      showCard(currentIndex);
    });

    function showView(viewName) {
      welcomeView.classList.add('hidden');
      loadingView.classList.add('hidden');
      studyView.classList.add('hidden');

      if (viewName === 'welcome') welcomeView.classList.remove('hidden');
      if (viewName === 'loading') loadingView.classList.remove('hidden');
      if (viewName === 'study') studyView.classList.remove('hidden');
    }

    function updateStatus(text) {
      loadingStatus.innerText = text;
    }
  </script>
</body>
</html>
